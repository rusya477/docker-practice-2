name: Full Stack Application Deployment Test
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "Creating env file from GitHub Secrets..."
          cat << 'EOF' > .env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d || docker-compose up -d
          Start-Sleep -Seconds 15
          docker compose ps || docker-compose ps

      - name: Verify containers are running
        run: |
          $ps = docker compose ps --status running
          if (-not $ps) { exit 1 }

      - name: Run application tests
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:${{ secrets.APP_PORT }}/health" -Method Get
          $webCount = (Invoke-RestMethod -Uri "http://localhost:${{ secrets.APP_PORT }}/api/items/count").count
          echo "Web API count: $webCount"

      - name: Create test report
        run: |
          @"
          # Deployment Test Report
          Date: $(Get-Date)
          Status: Passed
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs | Out-File deployment-logs.txt
          docker images | Out-File docker-images.txt
          docker ps -a | Out-File docker-ps.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30
